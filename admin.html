<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Pagode do Lukinha</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>body{padding:45px;max-width:1050px;margin:auto;background:#11100f}.admin{background:#f1ebdd;padding:35px;border-radius:16px}.admin-logo{width:190px}.tabs{display:flex;gap:8px;margin:25px 0}.tabs button{border:0;padding:12px 18px;border-radius:7px;font-weight:700;cursor:pointer}.tabs .active{background:#a62c2b;color:#fff}.panel{display:none}.panel.active{display:block}input,textarea{width:100%;padding:13px;margin:5px 0 12px;border:1px solid #bbb;border-radius:7px;font:inherit;background:#fff}textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{cursor:pointer}.item{padding:15px 0;border-top:1px solid #c7bfb1}.danger{border:0;background:#11100f;color:#fff;padding:8px 12px;border-radius:5px;margin-top:8px}.save{border:0;background:#a62c2b;color:#fff;padding:13px 18px;border-radius:7px;font-weight:700;text-transform:uppercase}.hint{color:#6c655d;font-size:14px}@media(max-width:600px){body{padding:15px}.admin{padding:22px}.row{grid-template-columns:1fr}.tabs{flex-wrap:wrap}}</style></head><body><div class="admin"><img class="admin-logo" src="assets/logo-preta.png" alt="Pagode do Lukinha"><h1>Painel administrativo</h1><p class="hint">Protótipo local. Agenda e vídeos são salvos neste navegador; a próxima etapa pode conectar o mesmo fluxo ao Supabase.</p><div class="tabs"><button class="active" data-tab="agenda">Agenda</button><button data-tab="videos">Vídeos</button></div><section id="agenda" class="panel active"><h2>Agenda</h2><div class="row"><input id="date" placeholder="28 SET"><input id="city" placeholder="SÃO CARLOS — SP"></div><div class="row"><input id="event" placeholder="Nome do evento"><input id="place" placeholder="Local"></div><div class="row"><input id="time" placeholder="20h"><input id="ticket" placeholder="Link de ingresso"></div><button class="save" onclick="addShow()">+ Novo show</button><div id="showList"></div></section><section id="videos" class="panel"><h2>Vídeos</h2><p class="hint">Cole o link do YouTube e escreva a descrição. O site cria o player automaticamente.</p><input id="videoTitle" placeholder="Título do vídeo"><input id="videoUrl" placeholder="https://www.youtube.com/watch?v=..."><textarea id="videoDescription" placeholder="Descrição do vídeo"></textarea><button class="save" onclick="addVideo()">+ Adicionar vídeo</button><div id="videoList"></div></section><p style="margin-top:30px"><a href="index.html">← Voltar ao site</a></p></div><script>
const $=id=>document.getElementById(id);document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});
function getShows(){return JSON.parse(localStorage.getItem('lukinha_shows')||'[]')}function renderShows(){$('showList').innerHTML=getShows().map((s,i)=>`<div class=item><b>${s.date} — ${s.city}</b><br>${s.event||''}${s.place?' · '+s.place:''}<br><button class=danger onclick="delShow(${i})">Excluir</button></div>`).join('')}function addShow(){let a=getShows();a.push({date:$('date').value,city:$('city').value,event:$('event').value,place:$('place').value,time:$('time').value,ticket:$('ticket').value});localStorage.setItem('lukinha_shows',JSON.stringify(a));renderShows();['date','city','event','place','time','ticket'].forEach(x=>$(x).value='')}function delShow(i){let a=getShows();a.splice(i,1);localStorage.setItem('lukinha_shows',JSON.stringify(a));renderShows()}
function getVideos(){return JSON.parse(localStorage.getItem('lukinha_videos')||'[]')}function renderVideos(){$('videoList').innerHTML=getVideos().map((v,i)=>`<div class=item><b>${v.title||'Sem título'}</b><br><span class=hint>${v.url}</span><p>${v.description||''}</p><button class=danger onclick="delVideo(${i})">Excluir</button></div>`).join('')}function addVideo(){const url=$('videoUrl').value.trim();if(!url){alert('Cole o link do YouTube.');return}let a=getVideos();a.push({title:$('videoTitle').value.trim(),url,description:$('videoDescription').value.trim()});localStorage.setItem('lukinha_videos',JSON.stringify(a));renderVideos();$('videoTitle').value='';$('videoUrl').value='';$('videoDescription').value=''}function delVideo(i){let a=getVideos();a.splice(i,1);localStorage.setItem('lukinha_videos',JSON.stringify(a));renderVideos()}renderShows();renderVideos();
</script></body></html>
